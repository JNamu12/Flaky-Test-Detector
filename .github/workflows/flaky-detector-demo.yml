name: Flaky Detector Demo Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-test-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: |
          mkdir -p results
          npx playwright test --reporter=junit
        continue-on-error: true
        # continue-on-error is intentional: we want the pipeline to keep
        # running even if tests fail, so results still reach the detector.
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: results/junit.xml

      - name: Send results to Flaky Test Detector
        if: always()
        env:
          API_KEY: ${{ secrets.DETECTOR_API_KEY }}
          RAW_DETECTOR_URL: ${{ secrets.DETECTOR_URL }}
        run: |
          if [ -f results/junit.xml ]; then
            DETECTOR_URL="${RAW_DETECTOR_URL:-https://flaky-test-detector-kbpc.onrender.com}"
            python tools/junit_xml_to_ingest.py results/junit.xml \
              --url "${DETECTOR_URL}/api/v1/test-runs/ingest" \
              --commit-sha "${{ github.sha }}" \
              --api-key "${API_KEY}"
          else
            echo "Warning: results/junit.xml not found. Skipping ingest."
          fi

      - name: Upload JUnit report as an artifact (optional backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: results/junit.xml
          if-no-files-found: warn
