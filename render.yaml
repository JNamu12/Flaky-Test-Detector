services:
  - type: web
    name: flaky-test-detector
    env: docker
    region: oregon
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    disk:
      name: flaky-detector-db
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DB_PATH
        value: /data/flaky_test_detector.db
