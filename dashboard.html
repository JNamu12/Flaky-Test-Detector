<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flaky Test Detector Dashboard</title>
  <style>
    /* Dark theme custom properties */
    :root {
      --bg: #0a0e15;               /* deep charcoal‑navy */
      --surface: #151c28;           /* slightly lighter card background */
      --border: #2a3545;            /* hairline border */
      --text-primary: #e5e9f0;      /* main text */
      --text-secondary: #cbd2db;    /* secondary text */
      --text-muted: #7a889f;        /* muted/disabled text */

      /* Semantic colors */
      --teal-base: #0db39e;
      --teal-bg: #0a3d36; /* muted background for pass */
      --teal-text: #e0f7f4; /* text on teal background */

      --amber-base: #ffb400;
      --amber-bg: #3b2e00; /* muted background for flaky */
      --amber-text: #fff4e5; /* text on amber background */

      --coral-base: #ff6f61;
      --coral-bg: #3a1113; /* muted background for fail */
      --coral-text: #ffe5e4; /* text on coral background */
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Helvetica Neue", "Segoe UI", "Arial", sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      line-height: 1.5;
    }

    /* Monospace stack for data */
    .mono {
      font-family: "SFMono-Regular", "Menlo", "Consolas", "Liberation Mono", "Courier New", monospace;
    }

    header {
      padding: 1.5rem 2rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .eyebrow {
      font-size: 0.75rem;
      text-transform: uppercase;
      opacity: 0.8;
      color: var(--text-secondary);
    }

    h1 {
      margin: 0.25rem 0 0.5rem;
      font-size: 2rem;
      color: var(--text-primary);
    }

    .subtitle {
      font-size: 1rem;
      color: var(--text-secondary);
    }

    #stats {
      padding: 1rem 2rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 0 2rem;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    thead {
      background: var(--bg);
    }

    th, td {
      padding: 0.75rem 1rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      font-weight: 600;
      color: var(--text-secondary);
    }

    tbody tr:hover {
      background: var(--bg);
    }

    /* ── Slide-over Detail Drawer & Backdrop ─────────────────────────── */
    #panel-backdrop {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(3px);
      z-index: 999;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    #panel-backdrop.open {
      display: block;
      opacity: 1;
    }

    #panel {
      position: fixed;
      top: 0;
      right: 0;
      width: 720px;
      max-width: calc(100vw - 30px);
      height: 100vh;
      background: var(--surface);
      border-left: 1px solid var(--border);
      box-shadow: -10px 0 35px rgba(0, 0, 0, 0.45);
      z-index: 1000;
      overflow-y: auto;
      margin: 0;
      transform: translateX(105%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
      opacity: 0;
      display: flex;
      flex-direction: column;
    }
    #panel.open {
      transform: translateX(0);
      opacity: 1;
    }

    #panel header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 1.1rem 1.4rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      gap: 1rem;
    }

    #panel header .title {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--text-primary);
      word-break: break-all;
      line-height: 1.4;
    }

    #panel header button {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 0.35rem;
      color: var(--text-primary);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0.3rem 0.6rem;
      line-height: 1;
      flex-shrink: 0;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }
    #panel header button:hover {
      background: var(--bg);
      border-color: var(--text-muted);
    }

    /* Helper badge classes */
    .badge {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border-radius: 0.25rem;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .badge.pass { background: var(--teal-bg); color: var(--teal-text); }
    .badge.flaky { background: var(--amber-bg); color: var(--amber-text); }
    .badge.fail { background: var(--coral-bg); color: var(--coral-text); }

    #stats {
      padding: 1rem 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
    }

    .stat-card {
      flex: 1;
      min-width: 120px;
      padding: 0.75rem 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.375rem;
      text-align: center;
    }

    .stat-label { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); }
    .stat-value { font-size: 1.5rem; font-weight: bold; color: var(--text-primary); }
    .stat-card[data-type="stable"] .stat-value { color: var(--teal-base); }
    .stat-card[data-type="flaky"] .stat-value { color: var(--amber-base); }
    .stat-card[data-type="bugs"] .stat-value { color: var(--coral-base); }

    @media (max-width: 640px) {
      #stats {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 0.75rem;
        padding: 1rem;
      }
      .stat-card {
        min-width: auto;
      }
    }

    /* ── Smooth transitions for theme switch ─────────────────────────── */
    * { transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease; }

    /* ── Light theme overrides ─────────────────────────────────────────── */
    [data-theme="light"] {
      --bg: #F5F7FA;
      --surface: #FFFFFF;
      --border: #DDE3EC;
      --text-primary: #1a2232;
      --text-secondary: #4a5568;
      --text-muted: #8a97a8;
      --teal-bg: #d0f5ef;
      --teal-text: #0a4d44;
      --amber-bg: #fff4cc;
      --amber-text: #6b4c00;
      --coral-bg: #ffd9d6;
      --coral-text: #8b1c1c;
    }

    /* ── Layout: sidebar + content area ──────────────────────────────── */
    .layout {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 220px;
      flex-shrink: 0;
      background: linear-gradient(180deg, #AFCBEF 0%, #3A5F8A 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 100;
      padding: 1.5rem 0 1rem 0;
    }

    .sidebar-brand {
      padding: 0 1.25rem 1.5rem 1.25rem;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      margin-bottom: 0.5rem;
      letter-spacing: 0.02em;
    }

    .sidebar nav {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
      flex: 1;
    }

    .sidebar nav a {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.65rem 1.25rem;
      color: rgba(255,255,255,0.9);
      text-decoration: none;
      font-size: 0.9rem;
      border-left: 3px solid transparent;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .sidebar nav a:hover,
    .sidebar nav a.active {
      background: rgba(255,255,255,0.15);
      border-left-color: #fff;
      color: #fff;
    }

    .sidebar-footer {
      padding: 0 1.25rem;
    }

    .sidebar-logout {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.65rem 0;
      color: rgba(255,255,255,0.75);
      font-size: 0.9rem;
      cursor: pointer;
      border-top: 1px solid rgba(255,255,255,0.2);
      padding-top: 1rem;
    }

    .sidebar-logout:hover {
      color: #fff;
    }

    .main-content {
      margin-left: 220px;
      flex: 1;
      min-width: 0;
    }

    /* ── Theme toggle button ──────────────────────────────────────────── */
    .theme-toggle {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-size: 1.1rem;
      border-radius: 0.375rem;
      padding: 0.3rem 0.6rem;
      cursor: pointer;
      line-height: 1;
      margin-left: auto;
    }

    .theme-toggle:hover {
      background: var(--bg);
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
    }

    .header-text { flex: 1; }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main-content { margin-left: 0; }
    }
  </style>
</head>
<body>
<div class="layout">

  <!-- ── Sidebar Navigation ──────────────────────────────────────────── -->
  <aside class="sidebar">
    <div>
      <div class="sidebar-brand">🧪 FlakyDetect</div>
      <nav>
        <a href="/" class="active">🏠 Dashboard</a>
        <a href="/api/v1/test-runs/" target="_blank">📊 Reports</a>
        <a href="/api/v1/test-runs/" target="_blank">⏱ Test History</a>
        <a href="/health" target="_blank">⚙ Settings</a>
        <a href="https://github.com/JNamu12/Flaky-Test-Detector" target="_blank">❓ Help</a>
      </nav>
    </div>
    <div class="sidebar-footer">
      <div class="sidebar-logout" onclick="alert('Log out clicked')">🚪 Log Out</div>
    </div>
  </aside>

  <!-- ── Main Content Area ───────────────────────────────────────────── -->
  <div class="main-content">

  <header>
    <div class="header-text">
      <div class="eyebrow">Dashboard</div>
      <h1>Flaky test detector</h1>
      <div class="subtitle">Live view of test stability and AI analysis</div>
    </div>
    <button class="theme-toggle" id="theme-toggle-btn" title="Toggle light/dark theme">🌗</button>
  </header>

  <div id="stats"></div>

  <table>
    <thead>
      <tr>
        <th>Test</th>
        <th>Run history</th>
        <th>Score</th>
        <th>Pass / fail</th>
        <th>Last run</th>
      </tr>
    </thead>
    <tbody id="table-body">
      <!-- rows will be injected by JS -->
    </tbody>
    </table>

    <!-- Backdrop overlay & Slide-over Detail Drawer -->
    <div id="panel-backdrop" onclick="closePanel()"></div>
    <div id="panel">
      <header>
        <span class="title">Detail view</span>
        <button aria-label="Close" onclick="closePanel()" title="Close (Esc)">✕</button>
      </header>
      <div class="content" style="padding:1.4rem;flex:1;">
        <div id="analysis-content"></div>
      </div>
    </div>

    <script>
      // Configuration – set to your backend URL if needed
      const apiBase = '';

      // Utility helpers
      const formatScore = score => (score * 100).toFixed(1) + '%';

      /**
       * Determine the badge CSS class for the Score column based on the
       * test's actual verdict history — NOT just the raw flakiness score.
       *
       * Rules:
       *  • Green  (pass)  — no failures ever recorded, or all recent runs pass
       *  • Red    (fail)  — no passes recorded at all (always fails),
       *                     OR the most recent run failed AND score is still 0
       *                     (too little history to score, but clearly broken)
       *  • Amber  (flaky) — has BOTH passes and failures in history
       */
      function verdictBadgeClass(s) {
        const { passCount, failCount, lastRun } = s;
        // Always failing — never passed
        if (failCount > 0 && passCount === 0) return 'badge fail';
        // Mixed history — genuinely flaky
        if (passCount > 0 && failCount > 0) return 'badge flaky';
        // No failures at all — clean
        return 'badge pass';
      }

      /**
       * Legacy score-only helper kept for backward compatibility.
       * Use verdictBadgeClass(summary) for table rows.
       */
      const badgeClassForScore = score => {
        if (score > 0.5) return 'badge fail';
        if (score >= 0.2) return 'badge flaky';
        return 'badge pass';
      };

      // ---------------------------------------------------------------------
      // Error analysis helpers
      // ---------------------------------------------------------------------

      /**
       * Normalise an error message into a stable "signature":
       *  1. Strip all digit sequences           ("line 42" → "line ")
       *  2. Strip parenthetical content          "(x=3, y=7)" → "")
       *  3. Take text before the first colon     "AssertionError: …" → "AssertionError"
       *  4. Trim whitespace
       */
      function normalizeError(msg) {
        if (!msg) return '';
        let s = msg
          .replace(/\d+/g, '')                // remove digits
          .replace(/\([^)]*\)/g, '')           // remove (…)
          .replace(/\[[^\]]*\]/g, '');         // remove […]
        const colon = s.indexOf(':');
        if (colon !== -1) s = s.substring(0, colon);
        return s.trim();
      }

      /**
       * Classify an error message by keyword rules.
       * Returns { category: string, verdict: string }.
       */
      function categorize(errMsg) {
        if (!errMsg) return { category: 'unknown', verdict: 'likely_flaky' };
        const m = errMsg.toLowerCase();

        // Server connection refused / Localhost not reachable
        if (m.includes('err_connection_refused') || m.includes('econnrefused') || m.includes('connection refused')) {
          return { category: 'server connection offline', verdict: 'likely_real_bug' };
        }

        // Timing / race-condition indicators
        if (m.includes('timeout') || m.includes('stale') || m.includes('target closed') || m.includes('waitforselector')) {
          return { category: 'timing / race condition', verdict: 'likely_flaky' };
        }

        // UI overlay / click intercepted
        if (m.includes('click intercepted') || m.includes('not clickable') || m.includes('elementclickintercepted')) {
          return { category: 'ui overlay / intercepted', verdict: 'likely_flaky' };
        }

        // Network / HTTP 5xx / API failure
        if (m.includes('503') || m.includes('500') || m.includes('502') || m.includes('service unavailable') || m.includes('networkerror')) {
          return { category: 'network / api timeout', verdict: 'likely_flaky' };
        }

        // Session / Auth expiry
        if (m.includes('session_expired') || m.includes('unauthorized') || m.includes('session expired')) {
          return { category: 'session / auth expiry', verdict: 'likely_flaky' };
        }

        // Missing Environment Variables / ReferenceError
        if (m.includes('referenceerror') || m.includes('is undefined') || m.includes('is not defined')) {
          return { category: 'environment / config missing', verdict: 'likely_flaky' };
        }

        // Generic one-off environment hiccup
        if (m.includes('one-off environment')) {
          return { category: 'environment', verdict: 'likely_flaky' };
        }

        // Assertion mentioning specific business terms → genuine regression
        const businessTerms = [
          'discount', 'pagination', 'price', 'total', 'balance',
          'inventory', 'quantity', 'shipping', 'tax', 'subtotal',
          'order', 'invoice', 'payment', 'cart', 'checkout',
        ];
        if (
          (m.includes('assert') || m.includes('expected') || m.includes('not equal') || m.includes('tobe(') || m.includes('tobegreaterthan')) &&
          businessTerms.some(term => m.includes(term))
        ) {
          return { category: 'genuine regression', verdict: 'likely_real_bug' };
        }

        if (m.includes('assert') || m.includes('expect(') || m.includes('tobe')) {
          return { category: 'assertion failure', verdict: 'likely_real_bug' };
        }

        // Fallback
        return { category: 'unknown', verdict: 'likely_flaky' };
      }

      // ---------------------------------------------------------------------
      // Data processing: group raw runs → per-test summaries
      // ---------------------------------------------------------------------
      function parseUTCDate(ts) {
        if (!ts) return null;
        if (ts instanceof Date) return isNaN(ts.getTime()) ? null : ts;
        let s = String(ts).trim();
        // Standardize format: "2026-09-02 02:13:45" -> "2026-09-02T02:13:45"
        s = s.replace(' ', 'T');
        // If string does not specify timezone offset (+HH:MM, -HH:MM, or Z), treat it as UTC from server
        if (!s.endsWith('Z') && !/[+-]\d{2}:?\d{2}$/.test(s)) {
          s += 'Z';
        }
        const d = new Date(s);
        return isNaN(d.getTime()) ? null : d;
      }

      function groupByTest(runs) {
        const grouped = {};
        runs.sort((a, b) => {
          const tA = parseUTCDate(a.timestamp)?.getTime() || 0;
          const tB = parseUTCDate(b.timestamp)?.getTime() || 0;
          return tA - tB;
        });
        runs.forEach(r => {
          if (!grouped[r.test_name]) grouped[r.test_name] = [];
          grouped[r.test_name].push(r);
        });
        return grouped;
      }

      function flakinessScore(runs) {
        if (runs.length < 3) return 0;
        let transitions = 0;
        for (let i = 1; i < runs.length; i++) {
          if (runs[i].status !== runs[i - 1].status) transitions++;
        }
        return transitions / (runs.length - 1);
      }

      function buildSummaries(rawRuns) {
        const groups = groupByTest(rawRuns);
        const summaries = [];
        for (const [name, runs] of Object.entries(groups)) {
          const score = flakinessScore(runs);
          const passCount = runs.filter(r => r.status === 'pass').length;
          const failCount = runs.filter(r => r.status === 'fail').length;
          const total = runs.length;
          const lastRun = runs[runs.length - 1];
          const failures = runs.filter(r => r.status === 'fail');
          const lastFailure = failures.length ? failures[failures.length - 1] : null;
          summaries.push({ name, runs, score, passCount, failCount, total, lastRun, lastFailure });
        }
        summaries.sort((a, b) => {
          const tsA = a.lastRun ? (parseUTCDate(a.lastRun.timestamp)?.getTime() || 0) : 0;
          const tsB = b.lastRun ? (parseUTCDate(b.lastRun.timestamp)?.getTime() || 0) : 0;
          if (tsB !== tsA) return tsB - tsA; // Most recent test runs first by default!
          return b.score - a.score;
        });
        return summaries;
      }

      // ---------------------------------------------------------------------
      // Table rendering & sorting
      // ---------------------------------------------------------------------
      let currentSort = { key: 'last_run', asc: false };
      let summaries = [];

      function formatTS(ts) {
        if (!ts) return '—';
        const d = parseUTCDate(ts);
        if (!d) return '—';
        const day = String(d.getDate()).padStart(2, '0');
        const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const month = monthNames[d.getMonth()];
        const hours = String(d.getHours()).padStart(2, '0');
        const minutes = String(d.getMinutes()).padStart(2, '0');
        return `${day} ${month} ${hours}:${minutes}`;
      }

      function renderRow(s, idx) {
        const tr = document.createElement('tr');
        tr.classList.add('mono');
        tr.tabIndex = 0;
        tr.dataset.testName = s.name;
        tr.dataset.index = idx;
        tr.addEventListener('click', () => openPanel(idx));
        tr.addEventListener('keydown', e => { if (e.key === 'Enter') openPanel(idx); });

        // 1 · Test name
        const tdName = document.createElement('td');
        tdName.textContent = s.name;
        tr.appendChild(tdName);

        // 2 · Run history — last 14 runs as small colored rectangles
        const tdHistory = document.createElement('td');
        const strip = document.createElement('div');
        strip.className = 'run-strip';
        const recent = s.runs.slice(-14);
        recent.forEach(r => {
          const dot = document.createElement('span');
          dot.className = r.status === 'pass' ? 'run-dot pass' : 'run-dot fail';
          dot.title = `${r.status.toUpperCase()} — ${formatTS(r.timestamp)}`;
          strip.appendChild(dot);
        });
        tdHistory.appendChild(strip);
        tr.appendChild(tdHistory);

        // 3 · Score badge — color reflects verdict category, not just raw score
        const tdScore = document.createElement('td');
        const badge = document.createElement('span');
        badge.className = verdictBadgeClass(s) + ' mono';
        badge.textContent = formatScore(s.score);
        // Tooltip explains both score and verdict
        const verdictLabel = s.failCount === 0 ? 'Always Passing'
          : s.passCount === 0 ? 'Always Failing (Real Bug)'
          : 'Flaky (Mixed History)';
        badge.title = `${verdictLabel} — Flip-rate score: ${formatScore(s.score)}`;
        tdScore.appendChild(badge);
        tr.appendChild(tdScore);

        // 4 · Pass / fail counts
        const tdPF = document.createElement('td');
        const lastFailTooltip = s.lastFailure ? ` (Last failure: ${formatTS(s.lastFailure.timestamp)})` : '';
        tdPF.title = `Passed: ${s.passCount}, Failed: ${s.failCount}${lastFailTooltip}`;
        tdPF.innerHTML =
          `<span style="color:var(--teal-base);font-weight:600;">${s.passCount}</span>` +
          `<span style="color:var(--text-muted)"> / </span>` +
          `<span style="color:var(--coral-base);font-weight:600;">${s.failCount}</span>`;
        tr.appendChild(tdPF);

        // 5 · Last run timestamp
        const tdLast = document.createElement('td');
        tdLast.textContent = formatTS(s.lastRun ? s.lastRun.timestamp : null);
        tr.appendChild(tdLast);

        return tr;
      }

      // ---------------------------------------------------------------------
      // Stat cards
      // ---------------------------------------------------------------------
      function renderStats() {
        const stats = document.getElementById('stats');
        stats.innerHTML = '';
        const total = summaries.length;
        const flaky = summaries.filter(s =>
          s.score >= 0.2 && s.passCount > 0 && s.failCount > 0
        ).length;
        const stable = summaries.filter(s =>
          s.score < 0.2 && s.failCount === 0
        ).length;
        const bugs = summaries.filter(s =>
          s.failCount === s.total && s.total > 0
        ).length;

        const cards = [
          { label: 'Tests Monitored', value: total, type: 'total' },
          { label: 'Flaky',           value: flaky, type: 'flaky' },
          { label: 'Stable',          value: stable, type: 'stable' },
          { label: 'Real Bugs',       value: bugs,  type: 'bugs' },
        ];

        cards.forEach(c => {
          const card = document.createElement('div');
          card.className = 'stat-card';
          card.dataset.type = c.type;
          card.innerHTML =
            `<div class="stat-label">${c.label}</div>` +
            `<div class="stat-value mono">${c.value}</div>`;
          stats.appendChild(card);
        });
      }

      let allRawRuns = [];
      const EMBEDDED_RUNS = [
  {
    "test_name": "test_stable_pass_10",
    "status": "pass",
    "timestamp": "2026-08-07T03:27:05.166356Z",
    "duration_ms": 4239,
    "error_message": null,
    "stack_trace": null,
    "commit_sha": "30a900ad939b462de645f129629c2ae31d9af659"
  },
  {
    "test_name": "test_stable_pass_12",
    "status": "pass",
    "timestamp": "2026-08-07T03:31:43.166356Z",
    "duration_ms": 2048,

      const LS_KEY = 'ftd-cached-runs';
      const LS_TS_KEY = 'ftd-cached-ts';

      // Show a small status banner below the header
      function setDataBanner(type, msg) {
        let banner = document.getElementById('data-banner');
        if (!banner) {
          banner = document.createElement('div');
          banner.id = 'data-banner';
          banner.style.cssText = [
            'font-size:0.8rem', 'padding:0.35rem 1.5rem', 'display:flex',
            'align-items:center', 'gap:0.5rem'
          ].join(';');
          const stats = document.getElementById('stats');
          if (stats) stats.parentNode.insertBefore(banner, stats);
        }
        const colours = {
          live:    { bg: '#d1fae5', color: '#065f46', icon: '🟢' },
          cached:  { bg: '#fef3c7', color: '#92400e', icon: '⚡' },
          retrying:{ bg: '#e0e7ff', color: '#3730a3', icon: '🔄' },
          sample:  { bg: '#fee2e2', color: '#991b1b', icon: '⚠️' },
        };
        const c = colours[type] || colours.sample;
        banner.style.background = c.bg;
        banner.style.color = c.color;
        banner.innerHTML = `<span>${c.icon}</span><span>${msg}</span>`;
        if (type === 'live') {
          setTimeout(() => { if (banner) banner.style.display = 'none'; }, 4000);
        }
      }

      function renderFromRuns(runs, source) {
        allRawRuns = runs;
        summaries = buildSummaries(allRawRuns);
        applySortingAndRender();
        renderStats();
        const ago = source === 'cached' ? (() => {
          const ts = parseInt(localStorage.getItem(LS_TS_KEY) || '0');
          if (!ts) return '';
          const mins = Math.round((Date.now() - ts) / 60000);
          return mins < 2 ? ' (just now)' : ` (${mins}m ago)`;
        })() : '';
        if (source === 'live')    setDataBanner('live',    `Live data loaded — ${runs.length} runs from database`);
        if (source === 'cached')  setDataBanner('cached',  `Showing cached data${ago} while Render wakes up…`);
        if (source === 'sample')  setDataBanner('sample',  'No real data yet — showing sample seed data. Run your CI pipeline to ingest results.');
      }

      async function tryFetch(url, timeoutMs) {
        const ctrl = new AbortController();
        const id = setTimeout(() => ctrl.abort(), timeoutMs);
        try {
          const r = await fetch(url, { signal: ctrl.signal });
          clearTimeout(id);
          return r;
        } catch(e) { clearTimeout(id); throw e; }
      }

      async function loadData() {
        // 1. Immediately show cached real data while we wait for the API
        const cached = localStorage.getItem(LS_KEY);
        if (cached) {
          try {
            const parsed = JSON.parse(cached);
            if (Array.isArray(parsed) && parsed.length > 0) {
              renderFromRuns(parsed, 'cached');
              setDataBanner('retrying', 'Refreshing from database…');
            }
          } catch(_) {}
        }

        // 2. Try to fetch from API with retries (Render free tier wakes in ~30s)
        const endpoints = ['/api/v1/test-runs/', '/api/v1/flaky-tests/'];
        const maxAttempts = 4;
        const delays = [0, 8000, 15000, 20000]; // ms between retries

        for (let attempt = 0; attempt < maxAttempts; attempt++) {
          if (attempt > 0) {
            setDataBanner('retrying', `Render is waking up… retry ${attempt}/${maxAttempts - 1} (this may take ~30s)`);
            await new Promise(r => setTimeout(r, delays[attempt]));
          }
          for (const endpoint of endpoints) {
            try {
              const resp = await tryFetch(endpoint, 18000);
              if (!resp.ok) continue;
              const data = await resp.json();
              if (!Array.isArray(data) || data.length === 0) continue;

              let runs;
              if (data[0].flakiness_score !== undefined) {
                // Summary format — expand into raw run rows
                runs = data.flatMap(item => Array(item.total_runs || 1).fill(null).map((_, i) => ({
                  test_name: item.test_name,
                  status: (i < item.fail_count) ? 'fail' : (item.last_status || 'pass'),
                  timestamp: new Date(Date.now() - ((item.total_runs || 1) - i) * 60000).toISOString(),
                  duration_ms: 150,
                  error_message: item.fail_count > 0 ? 'Test failure' : null,
                  stack_trace: null,
                  commit_sha: 'live'
                })));
              } else {
                runs = data;
              }

              // Save to localStorage for next page load
              try {
                localStorage.setItem(LS_KEY, JSON.stringify(runs));
                localStorage.setItem(LS_TS_KEY, Date.now().toString());
              } catch(_) {}

              renderFromRuns(runs, 'live');
              return; // success
            } catch (err) {
              console.warn(`Attempt ${attempt + 1} failed for ${endpoint}:`, err.message);
            }
          }
        }

        // 3. All retries exhausted — keep cached data if we have it, else use embedded sample
        if (cached) {
          try {
            const parsed = JSON.parse(cached);
            if (Array.isArray(parsed) && parsed.length > 0) {
              renderFromRuns(parsed, 'cached');
              setDataBanner('cached', 'Could not reach server — showing last cached data. Try refreshing in 30s.');
              return;
            }
          } catch(_) {}
        }
        renderFromRuns(EMBEDDED_RUNS, 'sample');
      }

      function getSortValue(summary, key) {
        if (!summary) return 0;
        if (key === 'name' || key === 'test' || key === 'test_name') {
          return (summary.name || '').toLowerCase();
        }
        if (key === 'total' || key === 'history' || key === 'total_runs') {
          return summary.total || 0;
        }
        if (key === 'score' || key === 'flakiness_score') {
          return summary.score || 0;
        }
        if (key === 'pass_fail' || key === 'passCount' || key === 'failCount') {
          return summary.failCount || 0;
        }
        if (key === 'last_run' || key === 'lastRun' || key === 'timestamp') {
          return summary.lastRun ? (parseUTCDate(summary.lastRun.timestamp)?.getTime() || 0) : 0;
        }
        return summary[key] ?? 0;
      }

      function applySortingAndRender() {
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = '';
        if (summaries.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:2rem;color:var(--text-secondary);">No test runs recorded yet. Ingest test results to view stability metrics.</td></tr>';
          selectedRowIndex = -1;
          return;
        }
        const sortKey = currentSort.key;
        const sorted = [...summaries].sort((a, b) => {
          const valA = getSortValue(a, sortKey);
          const valB = getSortValue(b, sortKey);
          if (valA < valB) return currentSort.asc ? -1 : 1;
          if (valA > valB) return currentSort.asc ? 1 : -1;
          // Secondary sort: when sorting by another field, break ties by newest last_run
          if (sortKey !== 'last_run') {
            const tsA = getSortValue(a, 'last_run');
            const tsB = getSortValue(b, 'last_run');
            return tsB - tsA;
          }
          return 0;
        });
        sorted.forEach((s, i) => {
          tbody.appendChild(renderRow(s, i));
        });
        selectedRowIndex = -1;
      }

      // ---------------------------------------------------------------------
      // Column header click → sort
      // ---------------------------------------------------------------------
      function initHeaderSorting() {
        const headerRow = document.querySelector('thead tr');
        const keys = ['name', 'total', 'score', 'pass_fail', 'last_run'];
        headerRow.querySelectorAll('th').forEach((th, idx) => {
          th.style.cursor = 'pointer';
          th.title = 'Click to sort';
          th.addEventListener('click', () => {
            const key = keys[idx];
            if (currentSort.key === key) {
              currentSort.asc = !currentSort.asc;
            } else {
              currentSort.key = key;
              currentSort.asc = (key === 'name'); // alphabetical asc by default, numeric/timestamps desc
            }
            applySortingAndRender();
          });
        });
      }

      // ---------------------------------------------------------------------
      // Keyboard navigation
      // ---------------------------------------------------------------------
      let selectedRowIndex = -1;
      function updateRowSelection() {
        const rows = document.querySelectorAll('#table-body tr');
        rows.forEach((r, i) => {
          r.classList.toggle('selected', i === selectedRowIndex);
          if (i === selectedRowIndex) r.focus();
        });
      }

      document.addEventListener('keydown', e => {
        const rows = document.querySelectorAll('#table-body tr');
        if (!rows.length) return;
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          selectedRowIndex = Math.min(selectedRowIndex + 1, rows.length - 1);
          updateRowSelection();
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          selectedRowIndex = Math.max(selectedRowIndex - 1, 0);
          updateRowSelection();
        } else if (e.key === 'Enter' && selectedRowIndex >= 0) {
          openPanel(selectedRowIndex);
        } else if (e.key === 'Escape') {
          closePanel();
        }
      });

      // ---------------------------------------------------------------------
      // Detail View Panel (openPanel)
      // ---------------------------------------------------------------------
      function extractStepName(r) {
        if (!r) return 'Execution Step';
        const msg = r.error_message || '';
        const stack = r.stack_trace || '';
        const combined = (msg + ' ' + stack).trim();

        // 1. Explicit named step: (step: loginStep) or Step 1: ...
        const explicitStep = combined.match(/\(step:\s*([\w\-]+)\)/i) ||
                             combined.match(/step\s*[:\-_]?\s*['"]?([a-zA-Z0-9_\-]+)['"]?/i);
        if (explicitStep && explicitStep[1] && !['the', 'this', 'a', 'in', 'of', 'to'].includes(explicitStep[1].toLowerCase())) {
          return explicitStep[1].trim();
        }

        // 2. Playwright / Jest assertion matchers: e.g. expect(received).toBeGreaterThanOrEqual
        const assertMatcher = msg.match(/expect\([^)]*\)\.([a-zA-Z0-9_]+)/i) ||
                              msg.match(/\.([a-zA-Z0-9_]+)\(expected\)/i);
        if (assertMatcher && assertMatcher[1]) {
          return `Assertion: ${assertMatcher[1]}`;
        }

        // 3. Playwright action / wait methods: e.g. page.waitForSelector, locator.click
        const actionMatch = combined.match(/(?:page|locator|expect)\.([a-zA-Z0-9_]+)\s*\(/i);
        if (actionMatch && actionMatch[1]) {
          return `Action: ${actionMatch[1]}`;
        }

        // 4. Common failure patterns
        if (/click intercepted|not clickable/i.test(msg)) return 'Action: click (element blocked)';
        if (/is detached from the DOM/i.test(msg)) return 'Action: locator (element detached)';
        if (/timeout\s*\d*ms\s*exceeded/i.test(msg)) return 'Wait: timeout exceeded';
        if (/503|econnreset|service unavailable/i.test(msg)) return 'Network: API request failed';
        if (/session_expired|session expired/i.test(msg)) return 'Auth: session expired';

        // 5. Test / function name from stack trace WITHOUT line:col numbers
        if (stack) {
          const fnMatch = stack.match(/at\s+(?:async\s+)?([a-zA-Z0-9_$.]+)\s*\(/i);
          if (fnMatch && fnMatch[1] && !fnMatch[1].includes('node_modules')) {
            const cleanFn = fnMatch[1].split('.').pop();
            return `Step: ${cleanFn}`;
          }
          // If file name match, strip the line numbers (:196:22 -> demo.spec.js)
          const fileMatch = stack.match(/([a-zA-Z0-9_\-]+\.(?:spec\.[jt]s|[jt]sx?|py))(?::\d+){1,2}/i);
          if (fileMatch && fileMatch[1]) {
            const errType = msg.split(/[:\n(]/)[0].trim();
            return errType ? `${errType} (${fileMatch[1]})` : fileMatch[1];
          }
        }

        // 6. First segment of error message
        if (msg) {
          const firstLine = msg.split('\n')[0].replace(/\s+/g, ' ').trim();
          const clean = firstLine.replace(/at\s+.*$/, '').trim();
          if (clean.length > 0 && clean.length <= 45) return clean;
          if (clean.length > 45) return clean.slice(0, 42) + '...';
        }

        return 'Execution Step';
      }

      function openPanel(idx) {
        const rows = document.querySelectorAll('#table-body tr');
        rows.forEach((r, i) => r.classList.toggle('selected', i === idx));
        selectedRowIndex = idx;

        const targetRow = rows[idx];
        if (!targetRow) return;
        const testName = targetRow.dataset.testName;
        const s = summaries.find(item => item.name === testName);
        if (!s) return;

        const panel = document.getElementById('panel');
        const container = document.getElementById('analysis-content');
        container.innerHTML = '';

        // 1. Panel header title
        const panelTitle = document.querySelector('#panel header .title');
        if (panelTitle) panelTitle.textContent = s.name;

        // 2. Empty-state if zero failures
        const failureRuns = s.runs.filter(r => r.status === 'fail');
        if (failureRuns.length === 0) {
          container.innerHTML = `
            <div style="padding:1rem;color:var(--teal-base);font-weight:600;">
              ✓ All ${s.total} runs passed cleanly! No failure history recorded for this test.
            </div>
          `;
          panel.style.display = 'block';
          return;
        }

        // 3. Most recent failure, normalized error, and categorization
        const latestFail = failureRuns[failureRuns.length - 1];
        const primaryError = latestFail.error_message || 'Unknown error message';
        const signature = normalizeError(primaryError);
        let { category, verdict } = categorize(primaryError);

        // Override: 100% failure rate with no passes → genuine bug, not flakiness
        if (s.passCount === 0 && s.failCount === s.total && s.total > 0) {
          verdict = 'likely_real_bug';
          if (category === 'unknown') category = 'consistent failure';
        }


        // 4. Search across ENTIRE runs dataset for similar failures (cap at 5)
        const similarFailures = [];
        for (const run of allRawRuns) {
          if (run.status === 'fail' && run.error_message) {
            if (normalizeError(run.error_message) === signature) {
              similarFailures.push(run);
              if (similarFailures.length >= 5) break;
            }
          }
        }

        // 5. Render verdict pill and category pill
        const pillsDiv = document.createElement('div');
        pillsDiv.style.display = 'flex';
        pillsDiv.style.alignItems = 'center';
        pillsDiv.style.gap = '0.75rem';
        pillsDiv.style.marginBottom = '1rem';

        const verdictPill = document.createElement('span');
        const isFlaky = verdict === 'likely_flaky';
        verdictPill.className = isFlaky ? 'badge flaky' : 'badge fail';
        verdictPill.textContent = isFlaky ? 'likely flaky' : 'likely real bug';

        const categoryPill = document.createElement('span');
        categoryPill.className = 'badge';
        categoryPill.style.background = 'var(--border)';
        categoryPill.style.color = 'var(--text-primary)';
        categoryPill.textContent = category;

        pillsDiv.appendChild(verdictPill);
        pillsDiv.appendChild(categoryPill);
        container.appendChild(pillsDiv);

        // 6. Render 2-3 sentence explanation
        const explP = document.createElement('p');
        explP.style.color = 'var(--text-secondary)';
        explP.style.lineHeight = '1.6';
        explP.style.marginBottom = '1.25rem';

        if (isFlaky) {
          explP.textContent = `Found ${similarFailures.length} matching failure(s) with this signature across the test suite. The flakiness score of ${formatScore(s.score)} alongside status transitions indicates non-deterministic behavior rather than a persistent code defect.`;
        } else {
          explP.textContent = `This test has failed 100% of its runs (${s.failCount}/${s.total}) with an identical error signature. The consistent failure pattern points to a genuine regression or broken system dependency.`;
        }
        container.appendChild(explP);

        // 7. Compute tool-grounded actionable recommendation text
        let stepName = extractStepName(latestFail);
        const combinedContext = `${s.name} ${primaryError} ${latestFail.stack_trace || ''}`.toLowerCase();
        let toolName = 'Generic';
        if (combinedContext.includes('playwright') || combinedContext.includes('.spec.') || combinedContext.includes('.ts') || combinedContext.includes('page.')) {
          toolName = 'Playwright';
        } else if (combinedContext.includes('selenium') || combinedContext.includes('webdriver')) {
          toolName = 'Selenium';
        } else if (combinedContext.includes('tosca') || combinedContext.includes('tbox')) {
          toolName = 'Tosca';
        }

        const err = primaryError.toLowerCase();
        let nextStepText = '';

        // 1. Connection Refused / Server Not Started / Localhost
        if (err.includes('err_connection_refused') || err.includes('econnrefused') || err.includes('connection refused') || err.includes('failed to fetch')) {
          const urlMatch = primaryError.match(/https?:\/\/[^\s\/\)]+(?::\d+)?/i);
          const targetUrl = urlMatch ? urlMatch[0] : 'http://localhost:3000';
          nextStepText = `In step '${stepName}', the target application server at <code>${targetUrl}</code> was not reachable. Ensure the local dev server is running before tests start (e.g. run <code>npm run dev</code> or configure <code>webServer</code> in playwright.config.js).`;
        }
        // 2. Element Click Intercepted / Overlay / Not Clickable
        else if (err.includes('click intercepted') || err.includes('not clickable') || err.includes('elementclickintercepted') || err.includes('overlay')) {
          if (toolName === 'Playwright') {
            nextStepText = `In step '${stepName}', wait for blocking modal/overlay to detach or scroll into view: <code>await page.locator('#target').scrollIntoViewIfNeeded(); await page.locator('.overlay').waitFor({ state: 'detached' });</code> before clicking.`;
          } else if (toolName === 'Selenium') {
            nextStepText = `In step '${stepName}', wait for element to become interactive: <code>WebDriverWait(driver, 10).until(EC.element_to_be_clickable((By.ID, 'submit')))</code>.`;
          } else if (toolName === 'Tosca') {
            nextStepText = `In step '${stepName}', set 'WaitOn' property to 'Visible and Clickable' on the Module attribute to wait for overlay dismissal.`;
          } else {
            nextStepText = `In step '${stepName}', ensure blocking overlay or animation finishes before interacting with the element.`;
          }
        }
        // 3. Timeout / Wait for Selector / Locator
        else if (err.includes('timeout') && (err.includes('waitfor') || err.includes('locator') || err.includes('selector') || err.includes('element') || err.includes('page.goto'))) {
          if (toolName === 'Playwright') {
            nextStepText = `In step '${stepName}', replace fixed delays with an explicit locator wait: <code>await page.locator('#target').waitFor({ state: 'visible', timeout: 15000 })</code> to handle asynchronous page hydration.`;
          } else if (toolName === 'Selenium') {
            nextStepText = `In step '${stepName}', replace thread sleep with explicit wait: <code>WebDriverWait(driver, 10).until(EC.visibility_of_element_located((By.ID, 'target')))</code>.`;
          } else {
            nextStepText = `In step '${stepName}', increase locator timeout and replace fixed delays with dynamic readiness polling.`;
          }
        }
        // 4. Network / HTTP 5xx / API Gateway Timeout
        else if (err.includes('503') || err.includes('500') || err.includes('502') || err.includes('service unavailable') || err.includes('gateway timeout') || err.includes('waitforresponse')) {
          if (toolName === 'Playwright') {
            nextStepText = `In step '${stepName}', handle asynchronous backend response or mock API fixtures: <code>await page.waitForResponse(resp => resp.url().includes('/api') && resp.status() === 200, { timeout: 15000 })</code>.`;
          } else {
            nextStepText = `In step '${stepName}', implement network retry wrapper or mock unreliable 3rd-party microservice endpoints.`;
          }
        }
        // 5. Session / Cookie / Auth Expiry
        else if (err.includes('session_expired') || err.includes('unauthorized') || err.includes('cookie') || err.includes('login?reason=') || err.includes('session expired')) {
          if (toolName === 'Playwright') {
            nextStepText = `In step '${stepName}', authentication state expired. Save and reuse browser state via <code>test.use({ storageState: 'auth.json' })</code> to maintain a valid session across test workers.`;
          } else {
            nextStepText = `In step '${stepName}', verify authentication tokens and refresh session cookies before running subsequent test steps.`;
          }
        }
        // 6. Missing Environment Variables / ReferenceError
        else if (err.includes('referenceerror') || err.includes('is undefined') || err.includes('is not defined') || err.includes('process.env')) {
          nextStepText = `In step '${stepName}', required environment variable is missing. Set the required configuration variable (e.g. <code>process.env.TEST_BASE_URL</code>) in your CI pipeline environment or <code>.env</code> file.`;
        }
        // 7. Strict mode violation / 0 elements / multiple elements
        else if (err.includes('strict mode violation') || err.includes('resolved to 0 elements') || err.includes('resolved to multiple elements')) {
          if (toolName === 'Playwright') {
            nextStepText = `In step '${stepName}', refine locator specificity: use <code>page.locator('.item').first()</code> or add distinctive test ID attributes (<code>page.getByTestId('target')</code>).`;
          } else {
            nextStepText = `In step '${stepName}', refine locator selectors to target a unique DOM element.`;
          }
        }
        // 8. Assertion errors / Genuine regression / Logic bugs
        else if (err.includes('assert') || err.includes('expect(') || err.includes('tobegreaterthan') || err.includes('tobe') || err.includes('toequal') || verdict === 'likely_real_bug') {
          nextStepText = `In step '${stepName}', assertion mismatch detected. Verify expected output against actual business logic changes and recent code commits.`;
        }
        // 9. Default fallback: diagnostic recommendation
        else {
          nextStepText = `In step '${stepName}', capture diagnostic artifacts (Playwright trace viewer, DOM snapshots, and HAR network logs) on failure to verify element attachment state and backend response.`;
        }

        // 8. Step Failure Breakdown Section (Prompt 3)
        const hasStepData = failureRuns.some(r => {
          if (r.stack_trace && r.stack_trace.trim().length > 0) return true;
          if (r.error_message) {
            const msg = r.error_message;
            if (/step\s*\d+|at\s+[\w\.\/]+:\d+|in\s+test_|\.spec\.|\.py:|\.ts:|\.js:/i.test(msg)) return true;
          }
          return false;
        });

        if (hasStepData) {
          const stepSection = document.createElement('div');
          stepSection.style.marginBottom = '1.25rem';
          stepSection.style.padding = '0.9rem 1rem';
          stepSection.style.background = 'var(--bg)';
          stepSection.style.border = '1px solid var(--border)';
          stepSection.style.borderRadius = '0.375rem';

          const stepTitle = document.createElement('h4');
          stepTitle.style.margin = '0 0 0.5rem 0';
          stepTitle.style.fontSize = '0.95rem';
          stepTitle.textContent = 'Step Failure Breakdown';
          stepSection.appendChild(stepTitle);

          // Group failures by step
          const stepMap = {};
          failureRuns.forEach(r => {
            const key = extractStepName(r);
            if (!stepMap[key]) {
              stepMap[key] = { count: 0, latestError: r.error_message || '' };
            }
            stepMap[key].count++;
            if (r.error_message) {
              stepMap[key].latestError = r.error_message;
            }
          });

          const sortedSteps = Object.entries(stepMap).sort((a, b) => b[1].count - a[1].count);
          const totalFailedRuns = failureRuns.length;
          const uniqueStepCount = sortedSteps.length;
          const topStepRatio = uniqueStepCount > 0 ? (sortedSteps[0][1].count / totalFailedRuns) : 1;

          // Variance Summary
          const stepSummaryP = document.createElement('div');
          stepSummaryP.style.fontSize = '0.85rem';
          stepSummaryP.style.marginBottom = '0.75rem';
          stepSummaryP.style.color = 'var(--text-secondary)';

          if (uniqueStepCount <= 1 || topStepRatio >= 0.75) {
            stepSummaryP.innerHTML = `<strong>Variance Summary:</strong> <span style="color:var(--coral-base);font-weight:600;">Failures are concentrated at one step</span>`;
          } else {
            stepSummaryP.innerHTML = `<strong>Variance Summary:</strong> <span style="color:var(--amber-base);font-weight:600;">Failures occur at different steps each time</span>`;
          }
          stepSection.appendChild(stepSummaryP);

          // 1. Table of steps
          const stepTable = document.createElement('table');
          stepTable.style.width = '100%';
          stepTable.style.margin = '0 0 0.75rem 0';
          stepTable.style.borderCollapse = 'collapse';
          stepTable.style.fontSize = '0.82rem';

          const thead = document.createElement('thead');
          thead.innerHTML = `
            <tr style="border-bottom:1px solid var(--border);text-align:left;">
              <th style="padding:0.4rem 0.5rem;color:var(--text-secondary);font-weight:600;">Step Name</th>
              <th style="padding:0.4rem 0.5rem;color:var(--text-secondary);font-weight:600;width:110px;">Failures</th>
              <th style="padding:0.4rem 0.5rem;color:var(--text-secondary);font-weight:600;">Most Recent Error Message</th>
            </tr>
          `;
          stepTable.appendChild(thead);

          const tbody = document.createElement('tbody');
          sortedSteps.forEach(([name, data]) => {
            const tr = document.createElement('tr');
            tr.style.borderBottom = '1px solid var(--border)';
            tr.innerHTML = `
              <td style="padding:0.45rem 0.5rem;font-weight:600;color:var(--text-primary);"><span class="mono">${name}</span></td>
              <td style="padding:0.45rem 0.5rem;"><span class="badge fail" style="font-size:0.75rem;">${data.count} of ${totalFailedRuns} runs</span></td>
              <td style="padding:0.45rem 0.5rem;color:var(--coral-text);font-family:monospace;font-size:0.8rem;word-break:break-word;">${data.latestError || '—'}</td>
            `;
            tbody.appendChild(tr);
          });
          stepTable.appendChild(tbody);
          stepSection.appendChild(stepTable);

          container.appendChild(stepSection);
        }

        // 2. Visually distinguished Actionable Recommendation box (Prompt 2 & 3)
        const actionBox = document.createElement('div');
        actionBox.style.padding = '0.85rem 1rem';
        actionBox.style.borderRadius = '0.375rem';
        actionBox.style.background = isFlaky ? 'rgba(255, 180, 0, 0.08)' : 'rgba(255, 111, 97, 0.08)';
        actionBox.style.border = '1px solid ' + (isFlaky ? 'var(--amber-base)' : 'var(--coral-base)');
        actionBox.style.marginBottom = '1.25rem';
        actionBox.style.boxShadow = isFlaky ? '0 0 10px rgba(255, 180, 0, 0.1)' : '0 0 10px rgba(255, 111, 97, 0.1)';

        actionBox.innerHTML = `
          <div style="display:flex;align-items:center;gap:0.4rem;font-weight:600;font-size:0.9rem;margin-bottom:0.35rem;color:${isFlaky ? 'var(--amber-base)' : 'var(--coral-base)'};">
            <span>⚡ Actionable Recommendation (What To Do)</span>
          </div>
          <div style="font-size:0.88rem;line-height:1.55;color:var(--text-primary);">
            ${nextStepText}
          </div>
        `;
        container.appendChild(actionBox);

        // 9. List similar failures found in step 4
        const listTitle = document.createElement('h4');
        listTitle.style.marginBottom = '0.5rem';
        listTitle.textContent = `Similar Failures Across Suite (${similarFailures.length})`;
        container.appendChild(listTitle);

        const ul = document.createElement('ul');
        ul.style.paddingLeft = '1.2rem';
        ul.style.color = 'var(--text-secondary)';
        ul.style.fontSize = '0.85rem';

        similarFailures.forEach(f => {
          const li = document.createElement('li');
          li.style.marginBottom = '0.35rem';
          li.innerHTML = `<strong>${f.test_name}</strong> &mdash; ${formatTS(f.timestamp)}`;
          ul.appendChild(li);
        });
        container.appendChild(ul);

        // 10. Open the slide-over drawer
        const backdrop = document.getElementById('panel-backdrop');
        panel.classList.add('open');
        if (backdrop) backdrop.classList.add('open');
        document.body.style.overflow = 'hidden';
      }

      function closePanel() {
        const panel = document.getElementById('panel');
        const backdrop = document.getElementById('panel-backdrop');
        if (panel) panel.classList.remove('open');
        if (backdrop) backdrop.classList.remove('open');
        document.body.style.overflow = '';
        const rows = document.querySelectorAll('#table-body tr');
        rows.forEach(r => r.classList.remove('selected'));
        selectedRowIndex = -1;
      }

      // ---------------------------------------------------------------------
      // Initialisation
      // ---------------------------------------------------------------------
      document.addEventListener('DOMContentLoaded', () => {
        loadData();
        initHeaderSorting();
      });
    </script>

    <style>
      /* Row hover & selection animation */
      tbody tr { transition: background-color 0.2s ease; }
      tbody tr:hover { background: var(--bg); }
      tbody tr.selected { background: var(--border); color: var(--text-primary); }

      /* Run-history strip of individual rectangles */
      .run-strip { display: inline-flex; gap: 2px; align-items: center; }
      .run-dot {
        display: inline-block; width: 0.55rem; height: 1rem;
        border-radius: 2px; transition: transform 0.15s ease;
      }
      .run-dot:hover { transform: scaleY(1.35); cursor: default; }
      .run-dot.pass { background: var(--teal-bg); border: 1px solid var(--teal-base); }
      .run-dot.fail { background: var(--coral-base); }

      /* Responsive adjustments */
      @media (max-width: 768px) {
        table, thead, tbody, th, td, tr { display: block; }
        th { position: absolute; left: -9999px; }
        td { border: none; position: relative; padding-left: 50%; }
        td::before {
          position: absolute;
          top: 0;
          left: 0;
          width: 45%;
          padding-right: 10px;
          white-space: nowrap;
          font-weight: 600;
          color: var(--text-secondary);
        }
        td:nth-of-type(1)::before { content: "Test"; }
        td:nth-of-type(2)::before { content: "Run history"; }
        td:nth-of-type(3)::before { content: "Score"; }
        td:nth-of-type(4)::before { content: "Pass / fail"; }
        td:nth-of-type(5)::before { content: "Last run"; }
      }
    </style>
    </div><!-- /.main-content -->
</div><!-- /.layout -->

<script>
  // ── Theme Toggle & Persistence ──────────────────────────────────────
  (function() {
    const btn = document.getElementById('theme-toggle-btn');
    const saved = localStorage.getItem('ftd-theme');
    if (saved === 'light') {
      document.body.setAttribute('data-theme', 'light');
      btn.textContent = '🌙';
    }
    btn.addEventListener('click', function() {
      const isLight = document.body.getAttribute('data-theme') === 'light';
      if (isLight) {
        document.body.removeAttribute('data-theme');
        localStorage.setItem('ftd-theme', 'dark');
        btn.textContent = '🌗';
      } else {
        document.body.setAttribute('data-theme', 'light');
        localStorage.setItem('ftd-theme', 'light');
        btn.textContent = '🌙';
      }
    });
  })();
</script>
</body>
</html>
