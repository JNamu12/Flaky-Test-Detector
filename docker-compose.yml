services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flaky_detector_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Qdrant: leave QDRANT_URL unset to use local file storage (recommended for single-host)
      # Set QDRANT_URL=http://qdrant:6333 to use the bundled Qdrant container instead.
      QDRANT_URL: ""
      # SQLite database will be stored in the mounted volume below
      DB_PATH: /data/flaky_test_detector.db
    volumes:
      # Persist SQLite DB across container restarts
      - backend_data:/data
      # Persist local Qdrant vector store (used when QDRANT_URL is empty)
      - qdrant_local:/app/qdrant_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s     # Allow time for model weights to load

  # -----------------------------------------------------------------------
  # Optional: standalone Qdrant container
  # Uncomment this section and set QDRANT_URL=http://qdrant:6333 in
  # the backend environment above if you want Qdrant running separately.
  # -----------------------------------------------------------------------
  # qdrant:
  #   image: qdrant/qdrant:latest
  #   container_name: flaky_detector_qdrant
  #   restart: unless-stopped
  #   ports:
  #     - "6333:6333"
  #   volumes:
  #     - qdrant_server:/qdrant/storage

volumes:
  backend_data:
    driver: local
  qdrant_local:
    driver: local
  # qdrant_server:
  #   driver: local
